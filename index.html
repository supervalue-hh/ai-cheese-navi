<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>AIチーズナビ</title>
<script src="cheese_data.js"></script>
<style>
  :root{
    --bg:#faf7f2;
    --card:#ffffff;
    --ink:#2b2320;
    --sub:#7a6f64;
    --accent:#9e2b25;
    --accent-soft:#f3e3dd;
    --gold:#b08d57;
    --gold-soft:#f4ecdd;
    --line:#e7ddd2;
    --tag-bg:#f1ece2;
    --tag-ink:#5c4a3a;
    --shadow:0 6px 18px rgba(60,40,20,0.08);
    --serif:'Georgia','Times New Roman','Yu Mincho','游明朝','Hiragino Mincho ProN',serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(176,141,87,0.07), transparent 60%),
      radial-gradient(900px 500px at -10% 35%, rgba(158,43,37,0.04), transparent 55%),
      var(--bg);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  header{
    background:var(--accent);
    color:#fff;
    padding:22px 24px 18px;
    text-align:center;
    box-shadow:var(--shadow);
    position:relative;
    z-index:5;
  }
  header h1{margin:0;font-size:clamp(24px,4vw,34px);letter-spacing:.03em;}
  header .store{margin-top:4px;font-size:clamp(13px,2vw,16px);opacity:.9;}
  main{flex:1;display:flex;flex-direction:column;align-items:center;padding:22px 16px 60px;width:100%;}
  .search-wrap{width:100%;max-width:640px;position:relative;}
  #searchInput{
    width:100%;
    font-size:clamp(18px,3vw,22px);
    padding:16px 20px;
    border-radius:16px;
    border:2px solid var(--line);
    outline:none;
    background:var(--card);
    box-shadow:var(--shadow);
  }
  #searchInput:focus{border-color:var(--accent);}
  .search-hint{color:var(--sub);font-size:13px;margin:10px 4px 0;text-align:center;}
  #candidateList{
    width:100%;max-width:640px;
    background:var(--card);
    border-radius:14px;
    box-shadow:var(--shadow);
    max-height:38vh;
    overflow-y:auto;
    margin-top:12px;
    display:none;
  }
  #candidateList.open{display:block;}
  .cand-item{
    background:var(--card);
    color:var(--ink);
    padding:14px 18px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }
  .cand-item:last-child{border-bottom:none;}
  .cand-item:hover,.cand-item:active{background:var(--accent-soft);}
  .cand-name{font-size:17px;font-weight:600;}
  .cand-type{font-size:12px;color:var(--sub);background:var(--tag-bg);padding:3px 10px;border-radius:999px;white-space:nowrap;}
  .cand-empty{padding:20px;text-align:center;color:var(--sub);line-height:1.7;}
  .cand-count{
    padding:8px 18px;font-size:12px;color:var(--sub);
    border-bottom:1px solid var(--line);background:var(--bg);
    border-radius:14px 14px 0 0;
  }

  .pickup-section{width:100%;max-width:640px;margin-top:22px;}
  .pickup-title{
    font-size:15px;font-weight:700;color:var(--accent);
    margin:0 4px 10px;display:flex;align-items:baseline;gap:10px;
    font-family:var(--serif);letter-spacing:.04em;
  }
  .pickup-title .pt-en{
    font-style:italic;font-weight:400;color:var(--gold);
    font-size:12px;letter-spacing:.18em;
  }
  .pickup-card{position:relative;overflow:hidden;}
  .pickup-card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--gold),#d9c49a);
  }
  .pickup-card .pk-name{font-family:var(--serif);}
  .pickup-row{
    display:flex;gap:12px;overflow-x:auto;
    padding:2px 2px 10px;
    -webkit-overflow-scrolling:touch;
    scroll-snap-type:x mandatory;
  }
  .pickup-card{
    flex:0 0 auto;
    width:150px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:14px;
    text-align:left;
    scroll-snap-align:start;
    cursor:pointer;
  }
  .pickup-card:active{background:var(--accent-soft);}
  .pickup-card .pk-name{font-size:14px;font-weight:700;line-height:1.35;margin-bottom:6px;display:block;}
  .pickup-card .pk-flavor{font-size:11.5px;color:var(--sub);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}

  .mode-tabs{
    width:100%;max-width:640px;
    display:flex;gap:8px;margin-top:20px;
  }
  .mode-tab{
    flex:1;padding:13px 0;
    border-radius:14px;
    border:1.5px solid var(--line);
    background:var(--card);
    color:var(--sub);
    font-size:15px;font-weight:700;
    cursor:pointer;
  }
  .mode-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  .tag-groups{
    width:100%;max-width:640px;
    margin-top:8px;
  }
  .tag-group-label{
    font-size:12px;color:var(--sub);font-weight:700;
    margin:14px 4px 6px;letter-spacing:.05em;
  }
  .tag-group-chips{display:flex;flex-wrap:wrap;gap:8px;}
  .tag-chip{
    padding:9px 16px;
    border-radius:20px;
    border:1.5px solid var(--line);
    background:var(--card);
    color:var(--ink);
    font-size:14px;
    cursor:pointer;
  }
  .tag-chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .tag-result-list{width:100%;max-width:640px;margin-top:16px;}
  .tag-result-head{
    font-size:13px;color:var(--sub);margin:0 4px 8px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .tag-result-head button{
    background:none;border:none;color:var(--accent);font-size:13px;cursor:pointer;
    text-decoration:underline;
  }

  .gyo-row{
    width:100%;max-width:640px;
    display:grid;grid-template-columns:repeat(5,1fr);gap:8px;
    margin-top:14px;
  }
  .gyo-chip{
    padding:14px 0;
    border-radius:12px;
    background:var(--card);
    border:1.5px solid var(--line);
    color:var(--ink);
    font-size:16px;font-weight:600;
    cursor:pointer;
    text-align:center;
  }
  .gyo-chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .gyo-chip.all{grid-column:span 5;padding:10px 0;font-size:14px;color:var(--sub);}
  .gyo-chip.all.active{color:#fff;}

  .type-row{
    width:100%;max-width:640px;
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
    margin-top:18px;
  }
  .type-chip{
    padding:8px 16px;
    border-radius:999px;
    background:var(--card);
    border:1.5px solid var(--line);
    color:var(--sub);
    font-size:13px;
    cursor:pointer;
    white-space:nowrap;
  }
  .type-chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  .browse-list{
    width:100%;max-width:640px;
    margin-top:16px;
  }
  .browse-item{
    background:var(--card);
    color:var(--ink);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:14px 18px;
    margin-bottom:10px;
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    cursor:pointer;
  }
  .browse-item:active{background:var(--accent-soft);}

  .result-card{
    width:100%;max-width:640px;
    background:var(--card);
    border-radius:20px;
    box-shadow:var(--shadow);
    padding:26px 24px 30px;
    margin-top:6px;
    animation:fadeIn .25s ease;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .result-entype{
    font-family:var(--serif);font-style:italic;
    color:var(--gold);font-size:13px;letter-spacing:.2em;
    margin-bottom:4px;
  }
  .result-name{font-size:clamp(22px,4vw,28px);font-weight:700;margin:0 0 2px;font-family:var(--serif);letter-spacing:.02em;}
  .result-formal{color:var(--sub);font-size:14px;margin-bottom:14px;font-family:var(--serif);font-style:italic;}
  .gold-rule{
    border:none;height:1px;margin:16px 0 4px;
    background:linear-gradient(90deg,transparent,var(--gold) 20%,var(--gold) 80%,transparent);
    opacity:.55;
  }
  .badge.teiki{background:linear-gradient(135deg,#c3a068,#a3824a);color:#fff;}
  .badge.kisetsu{background:#3f7a4f;color:#fff;}
  .section-label .sl-en{
    font-family:var(--serif);font-style:italic;font-weight:400;
    color:var(--gold);letter-spacing:.15em;margin-right:8px;
  }
  .badge-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
  .badge{
    background:var(--tag-bg);color:var(--tag-ink);
    padding:6px 14px;border-radius:999px;font-size:13px;
  }
  .badge.accent{background:var(--accent);color:#fff;}
  .section-label{
    font-size:13px;color:var(--sub);font-weight:600;
    margin:18px 0 6px;letter-spacing:.05em;
  }
  .flavor-text{font-size:16px;line-height:1.7;}
  .tag-cloud{display:flex;flex-wrap:wrap;gap:8px;}
  .tag-cloud .tag{
    background:var(--accent-soft);color:var(--accent);
    padding:7px 14px;border-radius:999px;font-size:14px;font-weight:600;
  }
  .keyword-cloud{display:flex;flex-wrap:wrap;gap:6px;}
  .keyword-cloud .kw{
    background:var(--bg);border:1px solid var(--line);color:var(--sub);
    padding:4px 10px;border-radius:999px;font-size:12px;
  }
  .back-btn{
    display:inline-block;margin-top:22px;
    background:none;border:1.5px solid var(--line);
    color:var(--sub);padding:10px 22px;border-radius:999px;
    font-size:14px;cursor:pointer;
  }
  .back-btn:active{background:var(--accent-soft);}

  footer{
    text-align:center;color:var(--sub);font-size:11px;
    padding:14px 10px 20px;opacity:.75;
  }
  .footer-credit{margin-bottom:4px;letter-spacing:.03em;}
  .fc-serif{font-family:var(--serif);font-style:italic;color:var(--gold);}
  .hidden{display:none !important;}

  /* --- decoration: header accent + logo mark (Mycella風、白/クリーム地に赤の差し色ひとつ) --- */
  header{background:linear-gradient(180deg,#ffffff 0%,#fdfaf6 100%);color:var(--ink);border-bottom:3px solid var(--accent);}
  header h1{
    color:var(--accent);font-weight:700;
    font-family:var(--serif);letter-spacing:.06em;
  }
  header h1::before{
    content:"";display:inline-block;width:16px;height:13px;
    background:var(--accent);
    clip-path:polygon(0 0, 100% 50%, 0 100%);
    margin-right:10px;vertical-align:baseline;
  }
  .en-sub{
    font-family:var(--serif);font-style:italic;
    color:var(--gold);font-size:clamp(12px,1.8vw,15px);
    letter-spacing:.22em;margin-top:2px;
  }
  header .store{color:var(--sub);}
  .header-corner{
    position:absolute;top:14px;right:16px;
    z-index:6;
  }
  .hero-mascot{
    width:100%;max-width:640px;
    margin:18px auto 2px;
    display:flex;flex-direction:column;align-items:center;
  }
  .hero-mascot img{
    width:100%;max-width:340px;
    border-radius:20px;
    border:4px solid var(--gold);
    box-shadow:0 10px 26px rgba(60,30,20,0.28);
    display:block;
  }
  .hero-mascot .caption{
    margin-top:10px;
    font-family:var(--serif);font-style:italic;
    color:var(--gold);font-size:clamp(13px,2.2vw,16px);
    letter-spacing:.06em;text-align:center;
  }
  .voice-toggle-btn{
    font-size:12px;font-weight:700;white-space:nowrap;
    padding:7px 12px;border:1px solid var(--line);border-radius:20px;
    background:var(--card);color:var(--sub);cursor:pointer;
  }
  .voice-toggle-btn:active{background:var(--accent-soft);}
  .about-line{
    max-width:640px;margin:2px auto 0;color:var(--sub);
    font-size:12px;line-height:1.6;text-align:center;
  }

  /* --- 50音キーボード --- */
  #searchInput[readonly]{background:var(--card);caret-color:var(--accent);}
  .kana-board{
    width:100%;max-width:640px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:12px;
    margin-top:12px;
  }
  .kana-row{display:flex;gap:5px;margin-bottom:5px;}
  .kana-key{
    flex:1;
    text-align:center;
    padding:9px 0;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:8px;
    font-size:15px;
    color:var(--ink);
    cursor:pointer;
    user-select:none;
  }
  .kana-key:active{background:var(--accent-soft);border-color:var(--accent);}
  .kana-key.wide{flex:1.6;font-size:13px;color:var(--sub);}
  .kana-key.func{background:var(--accent);color:#fff;border-color:var(--accent);font-size:13px;}
  .kana-key.blank{visibility:hidden;pointer-events:none;}

  button.kana-key,button.type-chip,button.cand-item,button.browse-item{
    font-family:inherit;
    font-size:inherit;
    margin:0;
    appearance:none;
    -webkit-appearance:none;
    outline:none;
    width:100%;
    text-align:center;
    cursor:pointer;
  }
  button.cand-item,button.browse-item{text-align:left;}
</style>
</head>
<body>

<header>
  <div class="header-corner">
    <button class="voice-toggle-btn" id="voiceToggleBtn" onclick="toggleVoice()">🔊 音声ON</button>
  </div>
  <h1>AIチーズナビ</h1>
  <div class="en-sub">European Cheese Selection</div>
  <div class="store" id="storeName">店舗名</div>
  <div class="about-line">本場ヨーロッパから直輸入する日本マイセラ株式会社の厳選チーズをご紹介します</div>
</header>

<main>
  <div class="hero-mascot">
    <img src="mascot.jpg" alt="チーズソムリエ 菅原">
    <div class="caption">Cheese Sommelier 菅原がご案内します</div>
  </div>

  <div class="pickup-section" id="pickupSection">
    <div class="pickup-title">今月のおすすめチーズ<span class="pt-en">Monthly Selection</span></div>
    <div class="pickup-row" id="pickupRow"></div>
  </div>

  <div class="mode-tabs" id="modeTabs">
    <button type="button" class="mode-tab active" id="modeTabPairing">🍷 料理・飲み物から探す</button>
    <button type="button" class="mode-tab" id="modeTabName">🧀 チーズ名から探す</button>
  </div>

  <div id="pairingMode">
    <div class="search-hint">今の気分や、合わせたいものを選んでください</div>
    <div class="tag-groups" id="tagGroups"></div>
    <div class="tag-result-list" id="tagResultList"></div>
  </div>

  <div id="nameMode" class="hidden">
    <div class="search-hint">チーズの名前の行と種類で絞り込めます</div>
    <div class="gyo-row" id="gyoRow"></div>
    <div class="type-row" id="typeRow"></div>
    <div class="browse-list" id="browseList"></div>
  </div>

  <div class="result-card hidden" id="resultCard"></div>
</main>

<footer>
  <div class="footer-credit">Cheese imported by <span class="fc-serif">Nippon Mycella Co., Ltd.</span> ｜ チーズ提供：日本マイセラ株式会社</div>
  <div id="buildStamp"></div>
</footer>

<script>
(function(){
  const DATA = (typeof CHEESE_DATA !== 'undefined') ? CHEESE_DATA : [];
  const BUILD_VER = '1.5.0';
  const BUILD_TIME = '2026-07-20';
  document.getElementById('buildStamp').textContent = 'AIチーズナビ v' + BUILD_VER + ' / ' + BUILD_TIME;

  // --- 音声読み上げ（ElevenLabs、AIソムリエと同じWorker経由・APIキーはWorker側に隠蔽） ---
  var _VOICE_HAMANO   = 'lfS4FNq2QJ0xr8H1zM7s';
  var _VOICE_HAYAKAWA = '7EJE8wGh8vEcDGpYYv8m';
  var _VOICE_PRESET   = 'EbuvaInXUGWtpYRUnKLQ';
  var _EL_WORKER = 'https://super-river-d169.hithithit1114.workers.dev';
  var _EL_VOICE  = _VOICE_HAYAKAWA; // ← 声を変えたい場合はここを _VOICE_HAMANO 等に
  var _voiceMuted = false;
  var _audioUnlocked = false;
  var _ttsAudio = null;
  var _SILENT_MP3 = 'data:audio/mpeg;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAASW5mbwAAAA8AAAADAAAGuAD//////////////////////////////////////////////////////////////////8AAAA5TEFNRTMuMTAwAaUAAAAAAAAAABQ4JAMGQgAAOAAAA==';

  function unlockAudio(){
    if (_audioUnlocked) return;
    _audioUnlocked = true;
    try {
      var a = new Audio(_SILENT_MP3);
      a.play().catch(function(){});
    } catch(e){}
  }

  function speakText(text){
    if (_voiceMuted || !text) return;
    try {
      if (!_ttsAudio) _ttsAudio = new Audio();
      _ttsAudio.volume = 1.0;
      _ttsAudio.src = _EL_WORKER + '/?text=' + encodeURIComponent(text) + '&voice_id=' + encodeURIComponent(_EL_VOICE);
      _ttsAudio.play().catch(function(e){ console.warn('play error:', e); });
    } catch(e){}
  }

  window.toggleVoice = function(){
    _voiceMuted = !_voiceMuted;
    var btn = document.getElementById('voiceToggleBtn');
    if (btn) btn.textContent = _voiceMuted ? '🔇 音声OFF' : '🔊 音声ON';
    if (_voiceMuted && _ttsAudio) _ttsAudio.pause();
  };

  const gyoRow = document.getElementById('gyoRow');
  const typeRow = document.getElementById('typeRow');
  const browseList = document.getElementById('browseList');
  const resultCard = document.getElementById('resultCard');
  const pickupSection = document.getElementById('pickupSection');
  const pickupRow = document.getElementById('pickupRow');
  const modeTabs = document.getElementById('modeTabs');
  const modeTabPairing = document.getElementById('modeTabPairing');
  const modeTabName = document.getElementById('modeTabName');
  const pairingMode = document.getElementById('pairingMode');
  const nameMode = document.getElementById('nameMode');
  const tagGroups = document.getElementById('tagGroups');
  const tagResultList = document.getElementById('tagResultList');

  // 料理ペアリング/ペアリングキーワードの統制語彙をグループ分け（お客様が選びやすいように）
  const TAG_GROUPS = [
    { label: 'お酒', tags: ['赤ワイン','白ワイン','スパークリングワイン','デザートワイン','ポートワイン','ビール'] },
    { label: 'パン・軽食', tags: ['バゲット','パン','クラッカー','サンドイッチ'] },
    { label: '甘いもの', tags: ['はちみつ','ジャム','ドライフルーツ','デザート','スイーツ','チョコレート','フルーツ','りんご','洋梨','いちじく','スコーン'] },
    { label: '飲みもの', tags: ['紅茶','コーヒー'] },
    { label: '料理・おつまみ', tags: ['肉料理','魚介','サラダ','野菜','オリーブ','オリーブオイル','パスタ','ピザ','グラタン','フォンデュ','カレー','じゃがいも','リゾット','燻製料理','生ハム','サラミ','ナッツ','くるみ','おつまみ'] }
  ];
  let activeTag = null;
  let activeMode = 'pairing';

  function tagMatch(c, tag){
    return wordsToTags(c['料理ペアリング']).includes(tag) || wordsToTags(c['ペアリングキーワード']).includes(tag);
  }

  function setMode(mode){
    activeMode = mode;
    hideResult();
    modeTabPairing.classList.toggle('active', mode === 'pairing');
    modeTabName.classList.toggle('active', mode === 'name');
    pairingMode.classList.toggle('hidden', mode !== 'pairing');
    nameMode.classList.toggle('hidden', mode !== 'name');
    if (mode === 'name') renderBrowseList();
  }
  modeTabPairing.onclick = () => setMode('pairing');
  modeTabName.onclick = () => setMode('name');

  function buildTagGroups(){
    tagGroups.innerHTML = '';
    TAG_GROUPS.forEach(group => {
      const validTags = group.tags.filter(t => DATA.some(c => tagMatch(c, t)));
      if (!validTags.length) return;
      const label = document.createElement('div');
      label.className = 'tag-group-label';
      label.textContent = group.label;
      tagGroups.appendChild(label);
      const row = document.createElement('div');
      row.className = 'tag-group-chips';
      validTags.forEach(t => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'tag-chip' + (activeTag === t ? ' active' : '');
        chip.textContent = t;
        chip.onclick = () => {
          activeTag = (activeTag === t) ? null : t;
          buildTagGroups();
          renderTagResults();
        };
        row.appendChild(chip);
      });
      tagGroups.appendChild(row);
    });
  }

  function renderTagResults(){
    hideResult();
    if (!activeTag) { tagResultList.innerHTML = ''; return; }
    const list = DATA.filter(c => tagMatch(c, activeTag))
      .sort((a,b) => (a['商品名略称']||'').localeCompare(b['商品名略称'], 'ja'));
    tagResultList.innerHTML = '';
    const head = document.createElement('div');
    head.className = 'tag-result-head';
    head.innerHTML = `<span>「${escapeHtml(activeTag)}」に合うチーズ ${list.length}件</span>`;
    const clearBtn = document.createElement('button');
    clearBtn.type = 'button';
    clearBtn.textContent = '選び直す';
    clearBtn.onclick = () => { activeTag = null; buildTagGroups(); renderTagResults(); };
    head.appendChild(clearBtn);
    tagResultList.appendChild(head);
    if (!list.length) {
      tagResultList.innerHTML += '<div class="cand-empty">該当するチーズが見つかりませんでした</div>';
      return;
    }
    const listWrap = document.createElement('div');
    listWrap.className = 'browse-list';
    list.forEach(c => {
      const item = document.createElement('button');
      item.type = 'button';
      item.className = 'browse-item';
      item.innerHTML = `<span class="cand-name">${escapeHtml(c['商品名略称'])}</span>${typeChipHtml(c['種別'])}`;
      item.onclick = () => showResult(c);
      listWrap.appendChild(item);
    });
    tagResultList.appendChild(listWrap);
  }

  // 「今月のおすすめ」枠。商品名略称で指定（月替わりで入れ替える想定。手動キュレーション）
  const PICKUP_NAMES = [
    'カマンベール・ジロ',
    'キャステロ クリーミーブルー',
    'モッツァレラ ブッファラ',
    'ゴーダ',
    'パルミジャーノレジャーノDOP',
    'エポワス',
    'ソワニヨン・フレッシュ・シェーブル・ハニー',
    'クロテッドクリーム プレーン(170g)'
  ];

  function buildPickupRow(){
    const items = PICKUP_NAMES
      .map(name => DATA.find(c => c['商品名略称'] === name))
      .filter(Boolean);
    if (!items.length) { pickupSection.classList.add('hidden'); return; }
    pickupRow.innerHTML = '';
    items.forEach(c => {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'pickup-card';
      card.innerHTML = `<span class="pk-name">${escapeHtml(c['商品名略称'])}</span><span class="pk-flavor">${escapeHtml(c['味わい'])}</span>`;
      card.onclick = () => showResult(c);
      pickupRow.appendChild(card);
    });
  }

  const TYPES = ['白カビ','青カビ','ウォッシュ','フレッシュ','ハード・セミハード','シェーブル','プロセス','クロテッドクリーム'];
  let activeType = null;

  // 濁点/半濁点を清音に畳み込む（キーボードは清音キーのみで、が→か等も拾えるように）
  const DAKUTEN_FOLD = {
    'が':'か','ぎ':'き','ぐ':'く','げ':'け','ご':'こ',
    'ざ':'さ','じ':'し','ず':'す','ぜ':'せ','ぞ':'そ',
    'だ':'た','ぢ':'ち','づ':'つ','で':'て','ど':'と',
    'ば':'は','び':'ひ','ぶ':'ふ','べ':'へ','ぼ':'ほ',
    'ぱ':'は','ぴ':'ひ','ぷ':'ふ','ぺ':'へ','ぽ':'ほ',
    'ゔ':'う'
  };

  // 小書き文字を大きい文字に畳み込む（キーボードにない ぇ ぉ 等も、え お で照合できるように）
  const SMALL_FOLD = {
    'ぁ':'あ','ぃ':'い','ぅ':'う','ぇ':'え','ぉ':'お',
    'ゃ':'や','ゅ':'ゆ','ょ':'よ','っ':'つ','ゎ':'わ'
  };

  function norm(s){
    let t = (s || '')
      .toString()
      .replace(/[Ａ-Ｚａ-ｚ０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0)) // 全角英数→半角
      .toLowerCase()
      .replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60)); // カタカナ→ひらがな粗変換
    t = t.replace(/[・\s()（）&＆'']/g, ''); // 中黒・空白・記号を無視
    t = t.replace(/[゙゚]/g, ''); // 結合濁点記号を除去
    t = t.replace(/[がぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽゔ]/g, ch => DAKUTEN_FOLD[ch] || ch);
    t = t.replace(/[ぁぃぅぇぉゃゅょっゎ]/g, ch => SMALL_FOLD[ch] || ch);
    t = t.replace(/ー/g, ''); // 長音の有無も吸収（クエリ側も同じ正規化を通るため対称）
    t = t.replace(/(.)\1+/g, '$1'); // 連続同一文字を圧縮（ッの畳み込みで生じる二重音を吸収。対称なので安全）
    return t;
  }

  // 英数字・漢字始まりなど、かな入力では届かない商品名への読みがな辞書
  const READING_OVERRIDES = {
    'NZレッドチェダー': 'えぬぜっとれっどちぇだー にゅーじーらんどれっどちぇだー',
    'NZパルメザン粉': 'えぬぜっとぱるめざんこ にゅーじーらんどぱるめざんこ',
    'USレッドチェダー': 'ゆーえすれっどちぇだー あめりかれっどちぇだー',
    'BUKO クリームチーズ': 'ぶこくりーむちーず',
    '3種アソート': 'さんしゅあそーと',
    '冷凍ルパックバター(有塩・無塩)': 'れいとうるぱっくばたー るぱっくばたー',
    'ゲランド塩のバター': 'げらんどしおのばたー',
    'ゲランド塩のミニバター': 'げらんどしおのみにばたー',
    'オーガニック3種の木の実ミックス': 'おーがにっくさんしゅのきのみみっくす',
    'ふりかけチーズプレミアム': 'ふりかけちーずぷれみあむ',
    'おつまみチーズパック': 'おつまみちーずぱっく'
  };

  // 検索用の正規化キャッシュを事前構築
  DATA.forEach(c => {
    c._n = norm(c['商品名略称']);
    c._f = norm(c['正式商品名']);
    const ov = READING_OVERRIDES[c['商品名略称']];
    c._r = ov ? ov.split(/\s+/).map(norm) : [];
  });

  // --- あ行〜わ行の絞り込みボタン ---
  const GYO_LIST = [
    {label:'あ行', chars:'あいうえお'},
    {label:'か行', chars:'かきくけこ'},
    {label:'さ行', chars:'さしすせそ'},
    {label:'た行', chars:'たちつてと'},
    {label:'な行', chars:'なにぬねの'},
    {label:'は行', chars:'はひふへほ'},
    {label:'ま行', chars:'まみむめも'},
    {label:'や行', chars:'やゆよ'},
    {label:'ら行', chars:'らりるれろ'},
    {label:'わ行', chars:'わをん'}
  ];
  let activeGyo = null;

  // 商品の先頭音（読みがな辞書があればそちらを優先。濁点・小書きは正規化済みなので清音で判定できる）
  function headChar(c){
    const s = (c._r[0] || c._n);
    return s.charAt(0);
  }

  function buildGyoRow(){
    gyoRow.innerHTML = '';
    GYO_LIST.forEach(g => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'gyo-chip' + (activeGyo === g.label ? ' active' : '');
      chip.textContent = g.label;
      chip.onclick = () => {
        activeGyo = (activeGyo === g.label) ? null : g.label; // 再タップで解除
        buildGyoRow();
        renderBrowseList();
      };
      gyoRow.appendChild(chip);
    });
    const allChip = document.createElement('button');
    allChip.type = 'button';
    allChip.className = 'gyo-chip all' + (activeGyo === null ? ' active' : '');
    allChip.textContent = 'すべて表示';
    allChip.onclick = () => { activeGyo = null; buildGyoRow(); renderBrowseList(); };
    gyoRow.appendChild(allChip);
  }

  function buildTypeRow(){
    typeRow.innerHTML = '';
    const allChip = document.createElement('button');
    allChip.type = 'button';
    allChip.className = 'type-chip' + (activeType === null ? ' active' : '');
    allChip.textContent = 'すべて';
    allChip.onclick = () => { activeType = null; renderBrowseList(); buildTypeRow(); };
    typeRow.appendChild(allChip);

    TYPES.forEach(t => {
      if (!DATA.some(c => c['種別'] === t)) return;
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'type-chip' + (activeType === t ? ' active' : '');
      chip.textContent = t;
      chip.onclick = () => { activeType = t; renderBrowseList(); buildTypeRow(); };
      typeRow.appendChild(chip);
    });
  }

  function renderBrowseList(){
    hideResult();
    const gyo = GYO_LIST.find(g => g.label === activeGyo);
    const list = DATA
      .filter(c => !activeType || c['種別'] === activeType)
      .filter(c => !gyo || gyo.chars.includes(headChar(c)))
      .slice()
      .sort((a,b) => (a['商品名略称']||'').localeCompare(b['商品名略称'], 'ja'));
    const cap = (activeGyo || activeType) ? list.length : 40; // 絞り込み中は全件表示
    browseList.innerHTML = '';
    if (list.length === 0) {
      browseList.innerHTML = '<div class="cand-empty">この条件のチーズはありません。別の行や種類をお試しください</div>';
      browseList.classList.remove('hidden');
      return;
    }
    list.slice(0, cap).forEach(c => {
      const item = document.createElement('button');
      item.type = 'button';
      item.className = 'browse-item';
      item.innerHTML = `<span class="cand-name">${escapeHtml(c['商品名略称'])}</span>${typeChipHtml(c['種別'])}`;
      item.onclick = () => showResult(c);
      browseList.appendChild(item);
    });
    if (list.length > 40) {
      const more = document.createElement('div');
      more.className = 'cand-empty';
      more.textContent = `他 ${list.length - 40} 件… 検索窓で絞り込めます`;
      browseList.appendChild(more);
    }
    browseList.classList.remove('hidden');
  }

  function escapeHtml(s){
    return (s || '').toString()
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // 種別ごとの色分け（装飾）
  const TYPE_COLORS = {
    '白カビ':'#8a7a55','青カビ':'#4a6b8a','ウォッシュ':'#b06a3b','フレッシュ':'#5a8a5f',
    'ハード・セミハード':'#a5772e','シェーブル':'#7d7d7d','プロセス':'#8a5a3b',
    'クロテッドクリーム':'#b05a7a','クラッカー&フード':'#96865a','グレーテッド等':'#6b7a8a'
  };
  // マイセラのカタログに合わせた英語カテゴリ名
  const TYPE_EN = {
    '白カビ':'White Mold','青カビ':'Blue Mold','ウォッシュ':'Wash Type','フレッシュ':'Fresh Type',
    'ハード・セミハード':'Hard & SemiHard','シェーブル':'Chevre','プロセス':'Processed',
    'クロテッドクリーム':'Clotted Cream','クラッカー&フード':'Cracker & Foods','グレーテッド等':'Ready to Eat'
  };
  function typeChipHtml(type){
    const col = TYPE_COLORS[type] || '#7a6f64';
    return `<span class="cand-type" style="color:${col};background:${col}1a;">${escapeHtml(type)}</span>`;
  }

  function wordsToTags(str){
    return (str || '').split(/\s+/).filter(Boolean);
  }

  function showResult(c){
    modeTabs.classList.add('hidden');
    pairingMode.classList.add('hidden');
    nameMode.classList.add('hidden');
    pickupSection.classList.add('hidden');

    const pairingTags = wordsToTags(c['料理ペアリング']);
    const keywordTags = wordsToTags(c['ペアリングキーワード']);

    const nyuka = c['入荷区分'] || '';
    const nyukaBadge =
      nyuka === '定期入荷品' ? `<span class="badge teiki">定期入荷品</span>` :
      nyuka === '季節限定入荷品' ? `<span class="badge kisetsu">季節限定入荷品</span>` : '';

    resultCard.innerHTML = `
      <div class="result-entype">${escapeHtml(TYPE_EN[c['種別']] || '')}</div>
      <div class="result-name">${escapeHtml(c['商品名略称'])}</div>
      <div class="result-formal">${escapeHtml(c['正式商品名'] || '')}</div>
      <div class="badge-row">
        <span class="badge accent" style="background:${TYPE_COLORS[c['種別']] || 'var(--accent)'};">${escapeHtml(c['種別'])}</span>
        <span class="badge">${escapeHtml(c['産地国'])}</span>
        ${c['原料乳'] ? `<span class="badge">${escapeHtml(c['原料乳'])}乳</span>` : ''}
        ${nyukaBadge}
      </div>
      <hr class="gold-rule">
      <div class="section-label"><span class="sl-en">Taste</span>味わい</div>
      <div class="flavor-text">${escapeHtml(c['味わい'])}</div>
      <div class="section-label"><span class="sl-en">Pairing</span>こんな食べ方・料理と相性◎</div>
      <div class="tag-cloud">
        ${pairingTags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}
      </div>
      ${keywordTags.length ? `
      <div class="section-label"><span class="sl-en">Keywords</span>関連キーワード</div>
      <div class="keyword-cloud">
        ${keywordTags.map(t => `<span class="kw">${escapeHtml(t)}</span>`).join('')}
      </div>` : ''}
      <button class="back-btn" id="backBtn">← 別のチーズを探す</button>
    `;
    resultCard.classList.remove('hidden');

    const topPairing = pairingTags.slice(0, 2).join('と');
    speakText(`${c['商品名略称']}です。${c['味わい']}${topPairing ? '。' + topPairing + 'によく合いますよ。' : ''}`);

    document.getElementById('backBtn').onclick = () => {
      hideResult();
      modeTabs.classList.remove('hidden');
      pickupSection.classList.remove('hidden');
      setMode(activeMode);
    };
    window.scrollTo({top:0, behavior:'smooth'});
  }

  function hideResult(){
    resultCard.classList.add('hidden');
    resultCard.innerHTML = '';
  }

  // 店頭kiosk向け: 無操作2分で最初の画面に戻る
  const IDLE_MS = 120000;
  let idleTimer = null;
  function goHome(){
    activeType = null;
    activeGyo = null;
    activeTag = null;
    hideResult();
    modeTabs.classList.remove('hidden');
    pickupSection.classList.remove('hidden');
    buildGyoRow();
    buildTypeRow();
    buildTagGroups();
    renderTagResults();
    setMode('pairing');
    window.scrollTo({top:0});
  }
  function resetIdle(){
    clearTimeout(idleTimer);
    idleTimer = setTimeout(goHome, IDLE_MS);
  }
  ['click','touchstart','scroll'].forEach(ev => document.addEventListener(ev, resetIdle, {passive:true}));
  ['click','touchstart'].forEach(ev => document.addEventListener(ev, unlockAudio, {passive:true, once:true}));

  buildGyoRow();
  buildPickupRow();
  buildTypeRow();
  buildTagGroups();
  setMode('pairing');
  resetIdle();
})();
</script>
</body>
</html>
